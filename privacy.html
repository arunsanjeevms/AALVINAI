<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privacy Policy — AALVINAI Technologies</title>
<meta name="description" content="Privacy Policy and Data Protection standards for AALVINAI Technologies.">
<meta name="theme-color" content="#050505">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 31.5 48.5'><path d='M21.5 0L21.5 19.5L31.5 19.5L31.5 29L10 48.5L10 28.5L0.5 28.5L0.5 18.5Z' fill='%23b4b4b4'/><rect x='0.5' y='18.5' width='9' height='10' fill='%23fdfdfd'/><rect x='22' y='19.5' width='9.5' height='9.5' fill='%23fdfdfd'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fafafa;
  --muted:#a7a6a6;
  --nav:#b6b5b5;
  --strip:#8b8a8a;
  --warm:#c9a274;
  --warm-dim:rgba(201,162,116,.5);
  --line:rgba(255,255,255,.09);
  --stage:#050505;
  --surface:#0a0a0a;
}
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0;
  padding:0;
  background:var(--stage);
  color:var(--muted);
  font-family:'Poppins',sans-serif;
  font-size:15px;
  line-height:1.8;
  -webkit-font-smoothing:antialiased;
}
.header{
  border-bottom:1px solid var(--line);
  padding:20px 32px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(5,5,5,.85);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  position:sticky;
  top:0;
  z-index:50;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
  color:var(--ink);
  font-family:'Space Grotesk',sans-serif;
  font-weight:700;
  font-size:15px;
  letter-spacing:.02em;
}
.back-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--nav);
  text-decoration:none;
  font-size:13px;
  transition:color .2s ease;
}
.back-link:hover{ color:var(--warm); }
.container{
  max-width:820px;
  margin:0 auto;
  padding:clamp(40px, 6vw, 80px) 24px clamp(60px, 8vw, 100px);
}
.eyebrow{
  font-family:'Space Grotesk',sans-serif;
  font-size:12px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--warm);
  margin:0 0 12px;
}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(32px, 5vw, 48px);
  color:var(--ink);
  margin:0 0 16px;
  line-height:1.15;
}
.meta{
  font-size:13px;
  color:var(--strip);
  margin-bottom:44px;
  padding-bottom:24px;
  border-bottom:1px solid var(--line);
}
h2{
  font-family:'Space Grotesk',sans-serif;
  font-size:20px;
  color:var(--ink);
  margin:36px 0 12px;
}
p{ margin:0 0 18px; }
ul{ margin:0 0 18px; padding-left:22px; }
li{ margin-bottom:8px; }
strong{ color:var(--ink); }
a{ color:var(--warm); text-decoration:none; }
a:hover{ text-decoration:underline; }
.footer{
</main>
</body>
</html>
