<style>
/* ======================================
   TOKENS + RESPONSIVE UNIT SYSTEM
   Reference canvas: 1487 x 1058
   ====================================== */
:root{
  --ink:#fafafa;
  --muted:#a7a6a6;
  --nav:#b6b5b5;
  --strip:#8b8a8a;
  --pill:#ffffff;
  --pill-ink:#050505;
  --stage:#050505;

  --u:calc(100vh / 1058);
  --uw:calc(100vw / 1487);
  --h:clamp(var(--u), calc(var(--u) * .65 + var(--uw) * .35), calc(var(--u) * 1.16));

  --ease:cubic-bezier(.22,1,.36,1);
}
@supports (height:100dvh){ :root{ --u:calc(100dvh / 1058); } }

/* ---- tokens for the sections below the hero (site-wide, additive) ---- */
:root{
  --warm:#c9a274;          /* the one restrained warm accent, used sparingly */
  --warm-dim:rgba(201,162,116,.5);
  --line:rgba(255,255,255,.09);
  --line-soft:rgba(255,255,255,.05);
  --surface:#0a0a0a;
  --edge:clamp(20px, 5vw, 64px);
  --section-y:clamp(48px, 7vw, 96px);
  --maxw:1280px;
}

*,*::before,*::after{ box-sizing:border-box; }

html{
  background:var(--stage);
}
html,body{
  min-height:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
  background:var(--stage);
}
@media (prefers-reduced-motion: no-preference){
  html{ scroll-behavior:smooth; }
}
